<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>night-city</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="menu">
      <div class="menu-titulo">Menu</div>
      <div class="menu-opcion">
        <img src="./img/iconos/auto.png" class="icono" alt="">
        Vehiculos
        <ul class="submenu">
          <li id="v_malibu">Malibu</li>
          <div class="submenu-opciones">
            <div class="malibu_color_1 color" id="malibu_color_1"></div>
            <div class="malibu_color_2 color" id="malibu_color_2"></div>
            <div class="malibu_color_3 color" id="malibu_color_3"></div>
          </div>
          <li id="v_jeep">Jeep</li>
          <div class="submenu-opciones">
            <div class="jeep_color_1 color" id="jeep_color_1"></div>
            <div class="jeep_color_2 color" id="jeep_color_2"></div>
            <div class="jeep_color_3 color" id="jeep_color_3"></div>
          </div>
          <li id="v_fiat">Fiat</li>
          <div class="submenu-opciones">
            <div class="fiat_color_1 color" id="fiat_color_1"></div>
            <div class="fiat_color_2 color" id="fiat_color_2"></div>
            <div class="fiat_color_3 color" id="fiat_color_3"></div>
          </div>
        </ul>
      </div>
      <div class="menu-opcion">
        <img src="./img/iconos/camara.png" class="icono" alt="">
        Cámara
        <ul class="submenu">
          <li id="camara_1">Cámara1</li>
          <li id="camara_2">Cámara2</li>
          <li id="camara_3">Cámara3</li>
        </ul>
      </div>
      <div class="menu-opcion">
        <img src="./img/iconos/radio.png" class="icono" alt="">
        Radio
        <ul class="submenu">
          <li id="radio_encender">Encender</li>
          <li id="radio_apagar">Apagar</li>
        </ul>
      </div>
    </div>

    <div class="radio" id="radio">
      <div class="radio-dentro">
        <div class="img-musica">
          <img src="" alt="" id="img_cancion" />
        </div>
        <div class="radio-informacion">
          <h1 id="nombre_cancion" class="nombre-cancion">nombre_canción</h1>
          <p id="nombre_artista" class="nombre-artista">artista_canción</p>
          <div class="radio-controles">
            <button id="anterior_cancion">⏮</button>
            <button id="empezar_cancion">▶</button>
            <button id="siguiente_cancion">⏭</button>
            <audio src="" id="cancion_input"></audio>
          </div>
        </div>
      </div>
    </div>

    <div class="reloj">
      <div class="hora-sistema">
        <div class="hora" id="hora">20:00</div>
      </div>
      <div class="dia" id="dia">Jueves</div>
    </div>

    <script src="app.ts" type="module"></script>
  </body>
</html>
